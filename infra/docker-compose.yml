# Bellwether stack. Run from repo root:  docker compose -f infra/docker-compose.yml up -d
# Variable substitution reads the repo-root .env (see .env.example).
services:
  db:
    image: timescale/timescaledb:latest-pg16
    # Persistent DB: come back on its own after a reboot/resize or crash, so a
    # long unattended backfill doesn't die against a DB that stayed stopped.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bellwether}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bellwether}
      POSTGRES_DB: ${POSTGRES_DB:-bellwether}
    volumes:
      - bellwether_pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bellwether} -d ${POSTGRES_DB:-bellwether}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply canonical schema migrations, then exit.
  migrate:
    build:
      context: ..
      dockerfile: infra/python.Dockerfile
    command: ["tt", "db", "init"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bellwether}:${POSTGRES_PASSWORD:-bellwether}@db:5432/${POSTGRES_DB:-bellwether}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  ingestion:
    build:
      context: ..
      dockerfile: infra/python.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bellwether}:${POSTGRES_PASSWORD:-bellwether}@db:5432/${POSTGRES_DB:-bellwether}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-}
      KALSHI_API_KEY_ID: ${KALSHI_API_KEY_ID:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bellwether}:${POSTGRES_PASSWORD:-bellwether}@db:5432/${POSTGRES_DB:-bellwether}
    ports:
      # Exposed for local dev; in prod put Caddy (profile: proxy) in front instead.
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Production reverse-proxy + basic-auth. Enable with: docker compose --profile proxy up
  caddy:
    image: caddy:2
    profiles: ["proxy"]
    depends_on:
      - dashboard
    environment:
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-:80}
      CADDY_BASIC_AUTH_USER: ${CADDY_BASIC_AUTH_USER:-admin}
      CADDY_BASIC_AUTH_HASH: ${CADDY_BASIC_AUTH_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - bellwether_caddy_data:/data
      - bellwether_caddy_config:/config
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    restart: unless-stopped

volumes:
  bellwether_pgdata:
  bellwether_caddy_data:
  bellwether_caddy_config:
