[project]
name = "bellwether"
version = "0.2.0"
description = "Bellwether — prediction-market trader intelligence (Python workspace root)."
requires-python = ">=3.10"
dependencies = [
    "bellwether-ingestion",
    "bellwether-analytics",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["ingestion", "analytics"]

[tool.uv.sources]
bellwether-ingestion = { workspace = true }
bellwether-analytics = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["ingestion/tests", "analytics/tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

