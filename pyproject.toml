[project]
name = "tradertracker"
version = "0.1.0"
description = "Track, score, and paper-trade prediction-market wallets (Polymarket-first, Kalshi flow signals)."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "cryptography>=41",
    "typer>=0.12",
    "rich>=13.7",
    "python-dateutil>=2.9",
]

[project.scripts]
tt = "tradertracker.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tradertracker*"]
