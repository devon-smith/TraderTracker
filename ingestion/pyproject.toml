[project]
name = "bellwether-ingestion"
version = "0.2.0"
description = "Bellwether ingestion — prediction-market clients, normalizers, and DB access."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "cryptography>=41",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "psycopg2-binary>=2.9",
    "eth-abi>=5.0",
    "eth-utils>=4.0",
    "eth-hash[pycryptodome]>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bellwether_ingestion*"]

[tool.setuptools.package-data]
bellwether_ingestion = [
    "db/alembic/*.py",
    "db/alembic/*.mako",
    "db/alembic/versions/*.py",
]
