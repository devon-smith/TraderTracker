[project]
name = "bellwether-ingestion"
version = "0.2.0"
description = "Bellwether ingestion — prediction-market clients, normalizers, and DB access."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "cryptography>=41",
    "asyncpg>=0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bellwether_ingestion*"]
