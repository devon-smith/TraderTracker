name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: Python lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install ./ingestion
          pip install --no-deps ./analytics
          pip install "typer>=0.12" "rich>=13.7" "python-dateutil>=2.9" "pytest>=8" "ruff>=0.5"
      - name: Ruff
        run: ruff check ingestion analytics
      - name: Pytest
        run: pytest -q

  migrations:
    name: Migrations apply on TimescaleDB
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: bellwether
          POSTGRES_PASSWORD: bellwether
          POSTGRES_DB: bellwether
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bellwether -d bellwether"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bellwether:bellwether@localhost:5432/bellwether
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install ./ingestion
          pip install --no-deps ./analytics
          pip install "typer>=0.12" "rich>=13.7" "python-dateutil>=2.9"
      - name: Apply migrations (idempotent — run twice)
        run: |
          tt db init
          tt db init

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Prisma needs a URL at build for client generation; a dummy is fine.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
